<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma Educativa</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React y ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- jsPDF y html2canvas para la descarga directa de PDF sin abrir la ventana de impresión -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- DATOS DE LOS 15 SUBCURSOS Y SUS PREGUNTAS FINALES EXCLUSIVAS ---
    const SUBCURSOS_DATA = [
      { id: 1, titulo: "1. Introducción y Fundamentos", contenido: "Bienvenido al Subcurso 1. En este módulo aprenderás los pilares esenciales y la terminología base para comenzar la formación.", pregFinal: { q: "¿Cuál es el objetivo principal planteado en la introducción del curso?", ops: ["Establecer los pilares y conceptos base", "Diseñar bases de datos avanzadas", "Saltar directamente a la práctica"], ans: 0 } },
      { id: 2, titulo: "2. Principios Teóricos", contenido: "En el Subcurso 2 exploramos el marco teórico que respalda las metodologías modernas.", pregFinal: { q: "¿Qué sostiene la estructura del marco teórico visto en el Subcurso 2?", ops: ["La improvisación constante", "Los principios de modelado teórico", "El uso de herramientas externas exclusivamente"], ans: 1 } },
      { id: 3, titulo: "3. Herramientas de Entorno", contenido: "Configuración del entorno de trabajo e instalación de dependencias principales.", pregFinal: { q: "¿Por qué es crucial la configuración inicial del entorno según el Subcurso 3?", ops: ["No es relevante", "Garantiza estabilidad e interoperabilidad", "Solo sirve para fines estéticos"], ans: 1 } },
      { id: 4, titulo: "4. Metodología y Flujo", contenido: "Análisis de las mejores metodologías paso a paso para organizar tareas de forma óptima.", pregFinal: { q: "¿Cuál es el beneficio de aplicar las metodologías de flujo del Subcurso 4?", ops: ["Incrementar la duplicidad de tareas", "Optimizar la organización de proyectos", "Reducir el enfoque en los resultados"], ans: 1 } },
      { id: 5, titulo: "5. Diagnóstico de Datos", contenido: "Técnicas iniciales para la recolección e interpretación correcta de datos.", pregFinal: { q: "¿Qué paso antecede a la interpretación según el Subcurso 5?", ops: ["La recolección sistemática de datos", "La entrega final del reporte", "La eliminación de los insumos"], ans: 0 } },
      { id: 6, titulo: "6. Estrategia de Arquitectura", contenido: "Definición y estructura estratégica para asegurar la escalabilidad.", pregFinal: { q: "¿Cuál es el propósito de la estrategia de arquitectura expuesta en el Subcurso 6?", ops: ["Evitar el uso de estándares", "Garantizar la escalabilidad a largo plazo", "Reemplazar los diagnósticos prevíos"], ans: 1 } },
      { id: 7, titulo: "7. Aplicación Práctica I", contenido: "Primeros ejercicios prácticos guiados para afianzar el conocimiento teórico.", pregFinal: { q: "¿Qué se busca en la primera fase de aplicación práctica del Subcurso 7?", ops: ["Memorizar conceptos sin aplicar", "Afianzar la teoría mediante ejercicios guiados", "Crear exámenes de prueba"], ans: 1 } },
      { id: 8, titulo: "8. Aplicación Práctica II", contenido: "Desarrollo de casos prácticos intermedios y resolución de escenarios complejos.", pregFinal: { q: "En la práctica del Subcurso 8, ¿cómo se abordan los escenarios complejos?", ops: ["Ignorando los errores", "Mediante análisis y resolución progresiva", "Reduciendo el tamaño del proyecto"], ans: 1 } },
      { id: 9, titulo: "9. Optimización de Procesos", contenido: "Técnicas avanzadas para mejorar la velocidad, eficiencia y rendimiento.", pregFinal: { q: "¿Qué métrica prioriza la optimización estudiada en el Subcurso 9?", ops: ["Rendimiento y velocidad de ejecución", "Aumento del código redundante", "Mayor consumo de recursos"], ans: 0 } },
      { id: 10, titulo: "10. Depuración y Control de Errores", contenido: "Identificación, aislamiento y resolución sistemática de fallos o inconsistencias.", pregFinal: { q: "¿Cuál es el primer paso ante un fallo según el Subcurso 10?", ops: ["Reescribir todo el sistema", "Aislar e identificar la causa raíz del problema", "Desactivar las alertas"], ans: 1 } },
      { id: 11, titulo: "11. Integración de Componentes", contenido: "Conexión y comunicación fluida entre diferentes módulos o sistemas.", pregFinal: { q: "¿Qué asegura una buena integración de componentes en el Subcurso 11?", ops: ["La independencia total sin comunicación", "La fluidez e intercambio correcto de datos entre módulos", "La duplicación de módulos"], ans: 1 } },
      { id: 12, titulo: "12. Métricas y Control de Calidad", contenido: "Establecimiento de indicadores de desempeño y estándares de evaluación.", pregFinal: { q: "¿Qué permiten los indicadores de desempeño del Subcurso 12?", ops: ["Evaluar la calidad de forma objetiva", "Aumentar el margen de error", "Omitir la revisión final"], ans: 0 } },
      { id: 13, titulo: "13. Patrones Avanzados", contenido: "Implementación de modelos avanzados para escenarios de alto nivel.", pregFinal: { q: "¿Cuándo se recomienda aplicar patrones avanzados según el Subcurso 13?", ops: ["En la fase inicial sin requerimientos", "En escenarios de alta complejidad que lo requieran", "Nunca se deben utilizar"], ans: 1 } },
      { id: 14, titulo: "14. Tendencias e Innovación", contenido: "Revisión de tecnologías emergentes e innovación aplicada.", pregFinal: { q: "¿Cuál es el objetivo de monitorear tendencias en el Subcurso 14?", ops: ["Mantener la solución actualizada e innovadora", "Sustituir bases sólidas por modas", "Abandonar metodologías vigentes"], ans: 0 } },
      { id: 15, titulo: "15. Cierre y Plan de Acción", contenido: "Consolidación de competencias, conclusiones y hoja de ruta profesional.", pregFinal: { q: "¿Qué se define en el módulo de cierre del Subcurso 15?", ops: ["Reiniciar todo el programa", "Una hoja de ruta y consolidación de competencias", "Un resumen exclusivo del diagnóstico"], ans: 1 } }
    ];

    // --- PREGUNTAS DEL DIAGNÓSTICO (DIFERENTES A LA EVALUACIÓN FINAL) ---
    const DIAGNOSTICO_PREGUNTAS = [
      { q: "1. Diagnóstico Inicial: ¿Cuál es tu experiencia previa en esta área?", ops: ["Principiante completo", "Nivel Intermedio", "Avanzado / Profesional"], ans: 0 },
      { q: "2. Diagnóstico Inicial: ¿Qué método prefieres para absorber contenidos?", ops: ["Lectura estructurada", "Ejercicios prácticos directos", "Evaluación continua"], ans: 1 },
      { q: "3. Diagnóstico Inicial: ¿Cuál es tu objetivo principal con este curso?", ops: ["Aprender desde cero", "Reforzar mis competencias", "Obtener el certificado de aprobación"], ans: 2 }
    ];

    function App() {
      // Estados de Navegación: 'registro' | 'diagnostico' | 'subcursos' | 'evaluacion' | 'resultado'
      const [pantalla, setPantalla] = useState('registro');
      
      // Usuario
      const [usuario, setUsuario] = useState({ nombre: '', correo: '' });
      
      // Avance de Subcursos
      const [subcursoActual, setSubcursoActual] = useState(0);

      // Respuestas
      const [respuestasDiag, setRespuestasDiag] = useState({});
      const [respuestasFinal, setRespuestasFinal] = useState({});
      const [puntajeFinal, setPuntajeFinal] = useState(0);

      // Manejadores
      const handleRegistro = (e) => {
        e.preventDefault();
        if (usuario.nombre && usuario.correo) {
          setPantalla('diagnostico');
        }
      };

      const handleDiagnostico = () => {
        setPantalla('subcursos');
      };

      const handleSiguienteSubcurso = () => {
        if (subcursoActual < SUBCURSOS_DATA.length - 1) {
          setSubcursoActual(subcursoActual + 1);
        } else {
          setPantalla('evaluacion');
        }
      };

      const handleAnteriorSubcurso = () => {
        if (subcursoActual > 0) {
          setSubcursoActual(subcursoActual - 1);
        }
      };

      const handleCalcularResultado = () => {
        let correctas = 0;
        SUBCURSOS_DATA.forEach((sc, idx) => {
          if (respuestasFinal[idx] === sc.pregFinal.ans) {
            correctas++;
          }
        });
        setPuntajeFinal(correctas);
        setPantalla('resultado');
      };

      // Función de Descarga PDF nativa optimizada para Laptop y Teléfono
      const descargarPDF = async () => {
        const { jsPDF } = window.jspdf;
        const certificadoElem = document.getElementById('certificado');

        if (!certificadoElem) return;

        // Convierte la vista HTML a un Canvas
        const canvas = await html2canvas(certificadoElem, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');

        // Crea el PDF en A4
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

        // Añade la imagen y descarga automáticamente sin abrir diálogo de impresión
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`Certificado_${usuario.nombre.replace(/\s+/g, '_')}.pdf`);
      };

      return (
        <div class="py-8">
          
          {/* HEADER / BARRA DE NAVEGACIÓN */}
          <header class="bg-white rounded-xl shadow-md p-6 mb-6 flex flex-col md:flex-row justify-between items-center border-b-4 border-indigo-600">
            <div>
              <h1 class="text-2xl font-bold text-slate-800">Plataforma de Capacitación</h1>
              <p class="text-sm text-slate-500">Programa Completo de 15 Módulos</p>
            </div>
            {usuario.nombre && (
              <div class="mt-4 md:mt-0 text-right">
                <span class="text-xs text-slate-400 block">Estudiante:</span>
                <span class="font-semibold text-indigo-700">{usuario.nombre}</span>
              </div>
            )}
          </header>

          {/* 1. COMPONENTE: REGISTRO */}
          {pantalla === 'registro' && (
            <div class="bg-white p-8 rounded-xl shadow-md max-w-md mx-auto">
              <h2 class="text-xl font-bold text-slate-800 mb-2">Registro de Estudiante</h2>
              <p class="text-sm text-slate-600 mb-6">Ingresa tus datos para comenzar el trayecto formativo.</p>
              <form onSubmit={handleRegistro} class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo</label>
                  <input 
                    type="text" 
                    required 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" 
                    value={usuario.nombre}
                    onChange={(e) => setUsuario({...usuario, nombre: e.target.value})}
                    placeholder="Ej. Juan Pérez"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                  <input 
                    type="email" 
                    required 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" 
                    value={usuario.correo}
                    onChange={(e) => setUsuario({...usuario, correo: e.target.value})}
                    placeholder="ejemplo@correo.com"
                  />
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">
                  Iniciar Curso
                </button>
              </form>
            </div>
          )}

          {/* 2. COMPONENTE: DIAGNÓSTICO */}
          {pantalla === 'diagnostico' && (
            <div class="bg-white p-8 rounded-xl shadow-md">
              <h2 class="text-xl font-bold text-slate-800 mb-2">Diagnóstico Inicial</h2>
              <p class="text-sm text-slate-600 mb-6">Responde a este cuestionario de inicio para personalizar tu experiencia.</p>
              
              <div class="space-y-6">
                {DIAGNOSTICO_PREGUNTAS.map((item, idx) => (
                  <div key={idx} class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                    <p class="font-medium text-slate-800 mb-3">{item.q}</p>
                    <div class="space-y-2">
                      {item.ops.map((op, opIdx) => (
                        <label key={opIdx} class="flex items-center space-x-3 p-2 bg-white rounded border hover:bg-slate-100 cursor-pointer">
                          <input 
                            type="radio" 
                            name={`diag_${idx}`} 
                            checked={respuestasDiag[idx] === opIdx}
                            onChange={() => setRespuestasDiag({...respuestasDiag, [idx]: opIdx})}
                            class="text-indigo-600"
                          />
                          <span class="text-sm text-slate-700">{op}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              <button 
                onClick={handleDiagnostico} 
                class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition"
              >
                Guardar Diagnóstico y Continuar a los Subcursos
              </button>
            </div>
          )}

          {/* 3. COMPONENTE: 15 SUBCURSOS */}
          {pantalla === 'subcursos' && (
            <div class="bg-white p-8 rounded-xl shadow-md">
              <div class="flex justify-between items-center mb-6 border-b pb-4">
                <span class="text-xs font-semibold uppercase tracking-wider bg-indigo-100 text-indigo-800 py-1 px-3 rounded-full">
                  Subcurso {subcursoActual + 1} de {SUBCURSOS_DATA.length}
                </span>
                <span class="text-sm text-slate-500">Progreso: {Math.round(((subcursoActual + 1) / 15) * 100)}%</span>
              </div>

              <h2 class="text-2xl font-bold text-slate-800 mb-4">{SUBCURSOS_DATA[subcursoActual].titulo}</h2>
              <div class="p-6 bg-slate-50 rounded-lg border border-slate-200 mb-8 min-h-[150px] text-slate-700 leading-relaxed">
                {SUBCURSOS_DATA[subcursoActual].contenido}
              </div>

              <div class="flex justify-between items-center pt-4 border-t">
                <button 
                  onClick={handleAnteriorSubcurso}
                  disabled={subcursoActual === 0}
                  class={`px-5 py-2.5 rounded-lg font-medium border ${subcursoActual === 0 ? 'opacity-50 cursor-not-allowed bg-slate-100' : 'hover:bg-slate-100 bg-white'}`}
                >
                  Anterior
                </button>
                
                <button 
                  onClick={handleSiguienteSubcurso}
                  class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition"
                >
                  {subcursoActual === SUBCURSOS_DATA.length - 1 ? "Ir a la Evaluación Final (15 Preguntas)" : "Siguiente Subcurso"}
                </button>
              </div>
            </div>
          )}

          {/* 4. COMPONENTE: EVALUACIÓN FINAL DE 15 PREGUNTAS (1 POR SUBCURSO) */}
          {pantalla === 'evaluacion' && (
            <div class="bg-white p-8 rounded-xl shadow-md">
              <h2 class="text-2xl font-bold text-slate-800 mb-2">Evaluación Final de Conocimientos</h2>
              <p class="text-sm text-slate-600 mb-6">
                A continuación se presentan 15 preguntas (exactamente 1 por cada subcurso completado).
              </p>

              <div class="space-y-6">
                {SUBCURSOS_DATA.map((sc, idx) => (
                  <div key={sc.id} class="p-5 bg-slate-50 rounded-lg border border-slate-200">
                    <span class="text-xs font-bold text-indigo-600 uppercase tracking-wide">Módulo {sc.id}</span>
                    <p class="font-semibold text-slate-800 mt-1 mb-3">{sc.pregFinal.q}</p>
                    <div class="space-y-2">
                      {sc.pregFinal.ops.map((opcion, opIdx) => (
                        <label key={opIdx} class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border hover:bg-slate-100 cursor-pointer">
                          <input 
                            type="radio" 
                            name={`final_q_${idx}`} 
                            checked={respuestasFinal[idx] === opIdx}
                            onChange={() => setRespuestasFinal({...respuestasFinal, [idx]: opIdx})}
                            class="text-indigo-600"
                          />
                          <span class="text-sm text-slate-700">{opcion}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              <button 
                onClick={handleCalcularResultado}
                class="mt-8 w-full bg-emerald-600 text-white py-3.5 rounded-lg font-bold text-lg hover:bg-emerald-700 transition shadow-lg"
              >
                Finalizar y Obtener Resultados
              </button>
            </div>
          )}

          {/* 5. COMPONENTE: RESULTADO Y DESCARGA NATIVA DE PDF */}
          {pantalla === 'resultado' && (
            <div class="space-y-6">
              
              {/* VISTA DEL CERTIFICADO (AQUÍ SE GENERA EL CANVAS/PDF) */}
              <div id="certificado" class="bg-white p-10 rounded-2xl shadow-xl border-8 border-indigo-50 text-center max-w-2xl mx-auto">
                <div class="border-2 border-indigo-600 p-8 rounded-xl">
                  <span class="text-indigo-600 text-sm font-bold tracking-widest uppercase">Certificado de Aprobación</span>
                  <h2 class="text-3xl font-extrabold text-slate-800 mt-4 mb-2">¡Felicitaciones!</h2>
                  <p class="text-slate-600 mb-6">Otorgado a:</p>
                  
                  <h3 class="text-2xl font-bold text-indigo-700 underline decoration-indigo-300 mb-6">{usuario.nombre}</h3>
                  
                  <p class="text-sm text-slate-600 max-w-md mx-auto mb-6">
                    Por haber completado satisfactoriamente el programa de 15 subcursos y aprobado la Evaluación Final.
                  </p>

                  <div class="inline-block bg-slate-100 px-6 py-3 rounded-lg border border-slate-200 mb-6">
                    <span class="text-xs text-slate-500 block uppercase font-semibold">Calificación Obtenida</span>
                    <span class="text-2xl font-black text-slate-800">{puntajeFinal} / 15 Aciertos</span>
                  </div>

                  <div class="text-xs text-slate-400 mt-4">
                    Fecha de emisión: {new Date().toLocaleDateString('es-ES')}
                  </div>
                </div>
              </div>

              {/* BOTÓN DE DESCARGA DIRECTA */}
              <div class="text-center max-w-md mx-auto">
                <button 
                  onClick={descargarPDF}
                  class="w-full bg-indigo-600 text-white py-3.5 px-6 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition flex items-center justify-center space-x-2"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                  <span>Descargar Certificado en PDF</span>
                </button>
                <p class="text-xs text-slate-500 mt-2">
                  Guarda el archivo directamente en tu equipo (laptop o teléfono) sin abrir el cuadro de diálogo de impresión.
                </p>
              </div>

            </div>
          )}

        </div>
      );
    }

    // Renderizado de la aplicación
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
